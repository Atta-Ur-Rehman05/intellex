[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intellex-backend"
version = "0.1.0"
description = "Phase 1 backend foundation for Intellex"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic-settings>=2.0,<3.0",
    "SQLAlchemy>=2.0,<3.0",
    "psycopg[binary]>=3.1,<4.0",
    "alembic>=1.13,<2.0",
    "argon2-cffi>=23.1,<26.0",
    "PyJWT>=2.8,<3.0",
    "pypdf>=5.0,<7.0",
    "pgvector>=0.3,<1.0",
    "sentence-transformers>=3.0,<6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0", "httpx>=0.27,<1.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
